name: openvpn-admin
on: 
  workflow_dispatch:  # 手动运行，不自动触发

jobs:
  build-x86:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      MAKE_JOBS: 4
      # 你使用的 ImmortalWrt SDK 地址
      SDK_URL: "https://downloads.immortalwrt.org/releases/23.05.0/targets/x86/64/immortalwrt-sdk-23.05.0-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
      # 核心编译包
      CORE_DEPENDENCIES: "openvpn-openssl luci-app-openvpn-admin"
      OTHER_DEPENDENCIES: "openssl-util curl luci-lib-jsonc luci-compat luci-base"

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 安装编译依赖
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libncurses5-dev gawk git wget unzip python3 python3-pip file rsync curl python3-pyelftools subversion time
          sudo pip3 install pyelftools || true

      - name: 3. 下载并解压 SDK
        id: sdk
        run: |
          wget --timeout=60 --tries=3 $SDK_URL -O sdk.tar.xz || { echo "SDK 下载失败"; exit 1; }
          tar xf sdk.tar.xz && mv $(find . -maxdepth 1 -type d -name "*sdk*" | head -1) openwrt-sdk
          ls -la openwrt-sdk/

      - name: 4. 准备插件文件
        run: |
          cd openwrt-sdk
          rm -rf package/luci-app-openvpn-admin && mkdir -p package/luci-app-openvpn-admin
          [ -f ../Makefile ] && cp ../Makefile package/luci-app-openvpn-admin/
          [ -d ../luasrc ] && cp -r ../luasrc package/luci-app-openvpn-admin/
          [ -d ../root ] && cp -r ../root package/luci-app-openvpn-admin/
          if [ -d ../files ]; then
            mkdir -p package/luci-app-openvpn-admin/root
            cp -r ../files/* package/luci-app-openvpn-admin/root/
          fi
          echo "==== 插件目录结构 ===="
          find package/luci-app-openvpn-admin -type d | sort | head -20

      - name: 5. 配置 feeds 源
        run: |
          cd openwrt-sdk
          cp feeds.conf.default feeds.conf.default.bak
          # 配置 ImmortalWrt 24.10 分支软件源
          cat > feeds.conf.default << EOF
          src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10
          src-git luci https://github.com/immortalwrt/luci.git;openwrt-24.10
          src-git routing https://github.com/openwrt/routing.git;openwrt-24.10
          src-git telephony https://github.com/openwrt/telephony.git;openwrt-24.10
          EOF
          echo "==== 已配置的feeds源 ===="
          cat feeds.conf.default

      - name: 6. 更新 feeds 并安装 openvpn
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a -f
          ./scripts/feeds install -f openvpn-openssl
          ./scripts/feeds install luci-base luci-lib-jsonc luci-compat curl openssl-util || true

          # ===================== 关键修复：自动禁用 DCO =====================
          # 报错原因：openvpn 2.6+ 默认开启 DCO 加速，需要 libnl-genl-3.0，云编译环境没有
          # 修复方法：给 Makefile 自动添加 --disable-dco 参数，绕开依赖
          if [ -f "feeds/packages/net/openvpn/Makefile" ]; then
            sed -i '/CONFIGURE_ARGS += \\/a \    --disable-dco \\' feeds/packages/net/openvpn/Makefile
            echo "✅ 已自动修复：禁用 DCO，解决 libnl-genl 编译错误"
          fi
          # ==================================================================

      - name: 7. 生成编译配置（启用 management 管理接口）
        run: |
          cd openwrt-sdk
          cat > .config << EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          # 你的插件
          CONFIG_PACKAGE_luci-app-openvpn-admin=y

          # 编译 openvpn-openssl（带管理接口）
          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_OPENVPN_openssl_ENABLE_MANAGEMENT=y
          CONFIG_OPENVPN_openssl_ENABLE_LZO=y
          CONFIG_OPENVPN_openssl_ENABLE_LZ4=y
          CONFIG_OPENVPN_openssl_ENABLE_FRAGMENT=y
          CONFIG_OPENVPN_openssl_ENABLE_PORT_SHARE=y
          CONFIG_OPENVPN_openssl_ENABLE_SMALL=y

          # openssl 相关依赖
          CONFIG_PACKAGE_libopenssl=y
          CONFIG_PACKAGE_libustream-openssl=y
          CONFIG_PACKAGE_openssl-util=y
          EOF

          make defconfig
          echo "==== 配置摘要 ===="
          grep -E "CONFIG_TARGET|CONFIG_PACKAGE|CONFIG_OPENVPN" .config

      - name: 8. 编译 openvpn-openssl
        run: |
          cd openwrt-sdk
          echo "==== 编译 openvpn-openssl ===="
          make package/openvpn/compile V=s -j$MAKE_JOBS 2>&1 | tee openvpn-compile-log.txt
          OPENVPN_IPK=$(find bin -name "*openvpn-openssl*.ipk" -type f | head -1)
          if [ -z "$OPENVPN_IPK" ]; then
            tail -100 openvpn-compile-log.txt
            echo "❌ openvpn-openssl 编译失败"
            exit 1
          else
            echo "✅ openvpn-openssl 编译成功"
          fi

      - name: 9. 编译 luci-app-openvpn-admin 插件
        run: |
          cd openwrt-sdk
          echo "==== 编译 luci-app-openvpn-admin ===="
          make package/luci-app-openvpn-admin/clean
          make package/luci-app-openvpn-admin/compile V=s -j$MAKE_JOBS 2>&1 | tee plugin-compile-log.txt
          MAIN_IPK=$(find bin -name "*luci-app-openvpn-admin*.ipk" -type f | head -1)
          if [ -z "$MAIN_IPK" ]; then
            tail -100 plugin-compile-log.txt
            echo "❌ 插件编译失败"
            exit 1
          else
            echo "✅ 插件编译成功"
          fi

      - name: 10. 收集 ipk 文件
        run: |
          cd openwrt-sdk
          mkdir -p ../output-x86_64
          # 复制 openvpn
          find bin -name "*openvpn-openssl*.ipk" -type f | head -1 | xargs -I {} cp {} ../output-x86_64/
          # 复制插件
          find bin -name "*luci-app-openvpn-admin*.ipk" -type f | head -1 | xargs -I {} cp {} ../output-x86_64/
          echo "==== 生成的文件 ===="
          ls -lh ../output-x86_64/

      - name: 11. 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-admin-x86_64
          path: output-x86_64/
          retention-days: 7
