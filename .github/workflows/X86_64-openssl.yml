name: luci-app-openvpn-admin (X86_64带接口)

on: 
  workflow_dispatch:  # 手动运行，不自动触发

jobs:
  build-x86:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      MAKE_JOBS: 4
      SDK_URL: "https://downloads.immortalwrt.org/releases/23.05.0/targets/x86/64/immortalwrt-sdk-23.05.0-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
      # 补充插件缺失的依赖
      DEPENDENCIES: "openssl-util curl openvpn-openssl luci-lib-jsonc luci-compat luci-base openvpn-easy-rsa netcat jq bash"

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 安装编译依赖
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libncurses5-dev gawk git wget unzip python3 python3-pip file rsync curl python3-pyelftools subversion time
          sudo pip3 install pyelftools || true

      - name: 3. 下载并解压 SDK
        id: sdk
        run: |
          wget --timeout=60 --tries=3 $SDK_URL -O sdk.tar.xz || { echo "SDK 下载失败"; exit 1; }
          tar xf sdk.tar.xz && mv $(find . -maxdepth 1 -type d -name "*sdk*" | head -1) openwrt-sdk
          ls -la openwrt-sdk/
          # 验证 feeds 路径
          echo "==== SDK Feeds 路径 ===="
          ls -la openwrt-sdk/feeds/

      - name: 4. 准备插件文件
        run: |
          cd openwrt-sdk
          rm -rf package/luci-app-openvpn-admin && mkdir -p package/luci-app-openvpn-admin
          [ -f ../Makefile ] && cp ../Makefile package/luci-app-openvpn-admin/
          [ -d ../luasrc ] && cp -r ../luasrc package/luci-app-openvpn-admin/
          [ -d ../root ] && cp -r ../root package/luci-app-openvpn-admin/
          if [ -d ../files ]; then
            mkdir -p package/luci-app-openvpn-admin/root
            cp -r ../files/* package/luci-app-openvpn-admin/root/
          fi
          echo "==== 插件目录结构 ===="
          find package/luci-app-openvpn-admin -type d | sort | head -20

      - name: 5. 更新 feeds 并安装依赖（含插件缺失依赖）
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a -f
          # 安装所有需要的依赖（包括插件缺失的）
          ./scripts/feeds install -a luci-base luci-lib-jsonc luci-compat openvpn-openssl curl openssl-util openvpn-easy-rsa netcat jq bash || true
          # 验证 OpenSSL feeds 是否安装成功
          echo "==== 验证 OpenSSL Feeds ===="
          ls -la feeds/packages/libs/openssl/ || echo "⚠ OpenSSL feeds 未找到"
          echo "==== 已安装的 feeds ===="
          ./scripts/feeds list | grep -E "luci|openvpn|curl|easy-rsa|netcat|jq|bash|openssl"

      - name: 5.5 配置 OpenSSL 编译选项（兼容 ImmortalWrt 23.05）
        run: |
          cd openwrt-sdk
          # ImmortalWrt 23.05 OpenSSL 实际路径：feeds/packages/libs/openssl
          OPENSSL_DIR="feeds/packages/libs/openssl"
          if [ ! -d "$OPENSSL_DIR" ]; then
            echo "❌ 未找到 OpenSSL 源码目录: $OPENSSL_DIR"
            exit 1
          fi
          
          # 备份原 Makefile
          cp $OPENSSL_DIR/Makefile $OPENSSL_DIR/Makefile.bak
          # 方式1：修改 OpenSSL Configure 阶段，追加管理接口相关编译选项
          # 注：ImmortalWrt 23.05 的 OpenSSL 用的是 Configure 脚本，不是直接的 make
          sed -i '/define Build\/Configure/ a \ \ \ \ echo "追加管理接口编译选项" && $(SED) "s|--openssldir=/etc/ssl|--openssldir=/etc/ssl --enable-ssl-trace --enable-ocsp --enable-cms|g" $(OPENSSL_CONFIG)' $OPENSSL_DIR/Makefile
          # 方式2：通过环境变量传递编译宏
          echo 'export CFLAGS="$CFLAGS -DOPENSSL_MANAGEMENT=1"' >> $OPENSSL_DIR/Makefile
          # 验证修改
          echo "==== 验证 OpenSSL Makefile 修改 ===="
          grep -E "enable-ssl-trace|OPENSSL_MANAGEMENT" $OPENSSL_DIR/Makefile || echo "⚠ 编译选项追加失败"

      - name: 6. 生成配置（简化配置，避免冲突）
        run: |
          cd openwrt-sdk
          # 清空原有配置，重新生成
          rm -f .config
          cat > .config << EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_PACKAGE_luci-app-openvpn-admin=y
          # OpenSSL 基础配置
          CONFIG_OPENSSL_OPTIMIZE_SPEED=y
          CONFIG_OPENSSL_ENGINE=y
          # OpenVPN 启用管理接口
          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_PACKAGE_openvpn-openssl_ENABLE_MANAGEMENT=y
          EOF
          # 生成配置（重定向警告到空）
          make defconfig 2>/dev/null
          echo "==== 配置摘要 ===="
          grep -E "CONFIG_TARGET|CONFIG_PACKAGE_openvpn|CONFIG_OPENSSL" .config

      - name: 7. 编译 OpenSSL（使用正确路径）
        run: |
          cd openwrt-sdk
          # 明确指定 OpenSSL 正确路径
          OPENSSL_DIR="feeds/packages/libs/openssl"
          if [ ! -d "$OPENSSL_DIR" ]; then
            echo "❌ OpenSSL 路径不存在: $OPENSSL_DIR"
            exit 1
          fi
          
          echo "==== 编译 OpenSSL（路径：$OPENSSL_DIR） ===="
          # 直接编译，跳过 clean（避免路径相关错误）
          make package/feeds/packages/openssl/compile V=sc -j$MAKE_JOBS || { 
            echo "==== OpenSSL 编译错误详情 ===="
            # 打印详细错误日志
            find . -name "*.log" -type f | xargs cat 2>/dev/null | tail -200
            echo "❌ OpenSSL 编译失败，终止"
            exit 1; 
          }

      - name: 8. 编译依赖包
        run: |
          cd openwrt-sdk
          for pkg in $DEPENDENCIES; do
            # 跳过已编译的 openssl-util
            if [ "$pkg" = "openssl-util" ]; then
              echo "==== 编译 openssl-util（依赖已编译的 OpenSSL） ===="
              make package/feeds/packages/openssl-util/compile V=sc -j$MAKE_JOBS || echo "⚠ openssl-util 编译失败，跳过"
              continue
            fi
            echo "==== 编译 $pkg ===="
            # 查找包的正确路径
            pkg_path=$(./scripts/feeds search -p $pkg | grep -o "/.*" | head -1)
            if [ -n "$pkg_path" ]; then
              make package/${pkg_path#/}/compile V=sc -j$MAKE_JOBS || echo "⚠ $pkg 编译失败，跳过（非关键）"
            else
              echo "⚠ $pkg 未找到，跳过"
            fi
          done

      - name: 9. 编译主插件
        run: |
          cd openwrt-sdk
          [ ! -d "package/luci-app-openvpn-admin" ] && { echo "插件目录缺失"; exit 1; }
          # 清理插件并编译
          make package/luci-app-openvpn-admin/clean V=s || echo "⚠ 插件清理失败，继续"
          make package/luci-app-openvpn-admin/compile V=s -j$MAKE_JOBS 2>&1 | tee compile-log.txt
          # 查找编译产物
          MAIN_IPK=$(find bin -name "*luci-app-openvpn-admin*.ipk" -type f | head -1)
          if [ -z "$MAIN_IPK" ]; then
            echo "==== 插件编译日志（最后100行） ===="
            tail -100 compile-log.txt
            echo "❌ 主插件编译失败"
          else
            echo "✅ 主插件编译成功: $MAIN_IPK"
          fi

      - name: 10. 收集编译产物
        run: |
          cd openwrt-sdk
          mkdir -p ../output-x86_64
          # 复制所有 IPK 文件
          find bin -name "*.ipk" -type f -exec cp {} ../output-x86_64/ \;
          echo "==== 输出目录内容 ===="
          ls -lh ../output-x86_64/
          # 验证主插件是否存在
          MAIN_IPK=$(find ../output-x86_64 -name "*luci-app-openvpn-admin*.ipk" 2>/dev/null | head -1)
          if [ -n "$MAIN_IPK" ]; then
            echo "✅ 找到主插件: $(basename $MAIN_IPK)"
          else
            echo "❌ 未找到主插件 IPK"
          fi

      - name: 11. 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-admin-x86_64
          path: output-x86_64/
          retention-days: 7

      - name: 12. 构建报告
        if: always()
        run: |
          echo "========================================"
          echo "构建状态报告 - X86_64"
          echo "========================================"
          echo "架构：x86_64 (64位)"
          echo "固件版本：ImmortalWrt 23.05.0"
          echo "作业状态: ${{ job.status }}"
          echo ""
          if [ -d output-x86_64 ]; then
            IPK_COUNT=$(find output-x86_64 -name "*.ipk" 2>/dev/null | wc -l)
            echo "📦 生成的 IPK 数量: $IPK_COUNT"
            MAIN_IPK=$(find output-x86_64 -name "*luci-app-openvpn-admin*.ipk" 2>/dev/null | head -1)
            if [ -n "$MAIN_IPK" ]; then
              echo "✅ 核心插件: $(basename $MAIN_IPK)"
              echo "📊 文件大小: $(du -h $MAIN_IPK | cut -f1)"
            else
              echo "❌ 核心插件编译失败"
            fi
          else
            echo "❌ 输出目录不存在"
          fi
